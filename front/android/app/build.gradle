apply plugin: 'com.android.application'

def mobileVariant = providers.environmentVariable('RSP_MOBILE_VARIANT').getOrElse('production')
if (!(mobileVariant in ['production', 'lab'])) throw new GradleException('Variante móvil desconocida')
def mobileLab = mobileVariant == 'lab'

android {
    namespace "uy.com.raulsilva.perforaciones"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "uy.com.raulsilva.perforaciones"
        if (mobileLab) applicationIdSuffix '.pruebas'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (['ANDROID_STORE_FILE', 'ANDROID_STORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
                    .every { providers.environmentVariable(it).isPresent() }) {
                storeFile file(providers.environmentVariable('ANDROID_STORE_FILE').get())
                storePassword providers.environmentVariable('ANDROID_STORE_PASSWORD').get()
                keyAlias providers.environmentVariable('ANDROID_KEY_ALIAS').get()
                keyPassword providers.environmentVariable('ANDROID_KEY_PASSWORD').get()
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    if (mobileLab) {
        // Debug resource overlay: production resources and namespace remain intact.
        sourceSets.debug.res.srcDir 'src/mobileLab/res'
    }
}

tasks.register('verifyMobileIsolation', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/verify-native-selection.mjs', mobileVariant,
        'android/app/src/main/assets/public', 'android/app/src/main/assets/capacitor.config.json'
}
tasks.named('preBuild').configure { dependsOn 'verifyMobileIsolation' }
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def expectedId = mobileLab ? 'uy.com.raulsilva.perforaciones.pruebas' : 'uy.com.raulsilva.perforaciones'
    if (variant.applicationId.get() != expectedId) throw new GradleException('Identidad Android efectiva incompatible')
}
gradle.taskGraph.whenReady { graph ->
    if (mobileLab && graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        throw new GradleException('Laboratorio sólo admite debug; distribución deshabilitada')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
