<input #selectorFoto class="selector-foto" type="file" accept="image/jpeg,image/png"
  aria-label="Seleccionar fotografía del pozo" (change)="archivoCambiado($event)">
<ion-button type="button" expand="block" (click)="abrirSelector()" [disabled]="procesando()" aria-describedby="error-foto">
  {{ procesando() ? 'Validando fotografía…' : 'Subir foto' }}
</ion-button>
@if (error()) { <ion-text id="error-foto" color="danger" role="alert">{{ error() }}</ion-text> }
