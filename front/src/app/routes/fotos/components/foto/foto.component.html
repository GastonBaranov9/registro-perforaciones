<input #selectorFoto class="selector-foto" type="file" accept="image/jpeg,image/png"
  aria-label="Seleccionar fotografía del pozo" (change)="archivoCambiado($event)">
@if (esNative) {
  <ion-button type="button" expand="block" (click)="tomarFoto()" [disabled]="procesando()">
    Tomar foto
  </ion-button>
}
<ion-button type="button" expand="block" (click)="abrirSelector()" [disabled]="procesando()">
  {{ esNative ? 'Elegir de galería' : 'Seleccionar foto' }}
</ion-button>
@if (procesando()) { <p role="status">Preparando fotografía…</p> }
@if (error()) { <ion-text color="danger" role="alert">{{ error() }}</ion-text> }
