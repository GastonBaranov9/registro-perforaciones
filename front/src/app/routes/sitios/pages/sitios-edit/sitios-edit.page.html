<ion-content class="ion-padding">
  <ion-card>
    <ion-card-content>
      <h2>Editar sitio</h2>

      <ion-button type="button" fill="clear" (click)="volver()">VOLVER</ion-button>

      @if (this.sitioResource.hasValue()) {
      <app-sitios-form [sitio]="this.sitioResource.value()!" (saved)="this.handleEdit($event)" />
      @if (auth.userId(); as idUsuario) {
        <app-mapa-aereo [idSitio]="id_sitio()" [idUsuario]="idUsuario" />
      }
      } @else if (this.sitioResource.isLoading()) {
      <p role="status">Cargando sitio…</p>
      } @else {
      <p role="alert">No fue posible cargar el sitio.</p>
      }

      <ion-button
        fill="outline"
        expand="block"
        (click)="this.sitioResource.reload()"
        [disabled]="this.disabled()"
      >
        RECARGAR
      </ion-button>

      @if (this.errorMessage()) {
      <div class="error-message">
        {{ this.errorMessage() }}
      </div>
      }
    </ion-card-content>
  </ion-card>
</ion-content>
