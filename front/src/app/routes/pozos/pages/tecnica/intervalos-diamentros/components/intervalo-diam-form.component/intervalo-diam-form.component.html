<form #intervaloLitForm="ngForm" (ngSubmit)="handleIntervaloDiam()">
  <ion-list>
    <ion-item>
      <ion-label position="stacked">Desde: </ion-label>
      <ion-input
        type="number"
        name="desde"
        [(ngModel)]="this.intervaloDiametro().desde_m"
        required
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Hasta: </ion-label>
      <ion-input
        type="number"
        name="hasta"
        [(ngModel)]="this.intervaloDiametro().hasta_m"
        required
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Diametro pulgada: </ion-label>
      <ion-input
        type="number"
        name="tamaño"
        [(ngModel)]="this.intervaloDiametro().diametro_pulg"
        required
      ></ion-input>
    </ion-item>
    <ion-item>
      <ion-select label="Material de tubería" name="material_tuberia" [(ngModel)]="intervaloDiametro().material_tuberia" required>
        <ion-select-option value="PVC">PVC</ion-select-option><ion-select-option value="Acero">Acero</ion-select-option>
      </ion-select>
    </ion-item>
  </ion-list>

  <ion-button type="submit" expand="block" [disabled]="intervaloLitForm.invalid">
    GUARDAR INTERVALO DIAMETROS
  </ion-button>
</form>
