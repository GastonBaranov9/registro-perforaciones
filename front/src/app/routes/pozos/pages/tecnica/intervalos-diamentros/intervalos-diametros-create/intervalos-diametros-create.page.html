<ion-content class="ion-padding">
  @if (!permisosTecnicos.puedeEditar()) { <p role="status">{{ permisosTecnicos.mensaje }}</p> }
    <ion-toolbar>
  <ion-buttons slot="start" color="primary">
     <ion-back-button default-href="#" (click)="irAtras()" color="primary"  ></ion-back-button>
     </ion-buttons>
</ion-toolbar>
 
  <ion-card>
    <ion-card-content>
      <h2>Crear un nuevo diametro de perforación</h2>
      @if (permisosTecnicos.puedeEditar()) {
<app-intervalo-diam-form
        [intervaloDiametro]="intervaloDiametro()"
        (saved)="guardarIntDiametro($event)"
      ></app-intervalo-diam-form>
}

      @if (errorMessage()) {
      <p class="error">
        {{ errorMessage() }}
      </p>
      }
    </ion-card-content>
  </ion-card>
</ion-content>
