
<ion-content>
<ion-toolbar>
  <ion-buttons slot="end" color="primary">
  <ion-button (click)="irACrear()" color="primary" fill="solid">Crear Nivel de Aporte</ion-button>
 </ion-buttons>
  <ion-buttons slot="start" color="primary">
     <ion-back-button default-href="#" (click)="irAtras()" color="primary"  ></ion-back-button>
     </ion-buttons>
</ion-toolbar>
 

  @for (nivelAporte of this.nivelesAporte(); track nivelAporte.id_nivel_aporte) {
  <ion-card>
    <ion-card-header>
      <ion-card-title
        >Nivel Aporte {{ nivelAporte.id_nivel_aporte }}</ion-card-title
      >
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <dl class="data-row">
          <dt>Desde: </dt>
          <dd>{{ nivelAporte.profundidad_m }}</dd>
        </dl>
      </ion-list>
      @if(!this.id_pozo){
      <p role="alert">Pozo No Encontrado</p>
      }@else{
      <ion-button fill="outline" (click)="irAEditar(nivelAporte)">Editar</ion-button>
      <ion-button fill="outline" color="danger" (click)="borrarNivelAporte(nivelAporte)"> Borrar </ion-button>
      }
    </ion-card-content>
  </ion-card>
  }
</ion-content>
