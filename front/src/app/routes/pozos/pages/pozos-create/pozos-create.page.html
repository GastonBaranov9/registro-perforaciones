<ion-content class="ion-padding">
  <ion-content>
    <ion-toolbar>
      <ion-buttons slot="start" color="primary">
        <ion-back-button default-href="#" (click)="irAtras()" color="primary"></ion-back-button>
      </ion-buttons>
    </ion-toolbar>
    <ion-card>
      <ion-card-content>
        <h2>Crear nueva perforación</h2>

        <app-pozos-form
          [pozo]="nuevoPozo()"
          (saved)="guardarPozo($event)"
          [id_pozo]="null"
          [agregareditar]="false"
          [guardando]="disabled()"
          (crearSitio)="crearSitio()"
        >
          <app-datos-tecnicos-borrador
            [profundidad]="nuevoPozo().profundidad_final_m"
            [guardando]="disabled()"
            (cambiado)="datosTecnicos.set($event)"
          />
        </app-pozos-form>

        @if (disabled()) { <p role="status">Guardando perforación completa…</p> }

        @if (errorMessage()) {
        <p class="error">
          {{ errorMessage() }}
        </p>
        }
      </ion-card-content>
    </ion-card>
  </ion-content>
</ion-content>
