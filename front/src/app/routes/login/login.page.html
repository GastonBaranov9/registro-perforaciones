<ion-content class="ion-padding hero-welcome">
  <div class="hero-card">
    <div class="hero-card-inner">
      <div class="hero-subtitle">Iniciar sesión</div>

      <h1 class="hero-title">Accedé a tu cuenta</h1>
      <div class="form-field">
        <ion-input
          label="Email" labelPlacement="stacked" autocomplete="username"
          type="email"
          [(ngModel)]="this.credenciales.email"
          (ngModelChange)="error.set('')"
          name="email"
          placeholder="Ingresá tu email de acceso"
          helperText="Introducir un email válido"
          errorText="Email invalido"
          email
        >
        </ion-input>
      </div>

      <div class="form-field">
        <ion-input
          label="Contraseña" labelPlacement="stacked" autocomplete="current-password"
          [type]="passwordVisible() ? 'text' : 'password'"
          autocapitalize="off" [spellcheck]="false"
          [(ngModel)]="this.credenciales.password"
          (ngModelChange)="error.set('')"
          name="password"
          placeholder="••••••••"
        >
          <ion-button slot="end" type="button" fill="clear" class="password-toggle"
            [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            (pointerdown)="$event.preventDefault()"
            (click)="passwordVisible.set(!passwordVisible())">
            <ion-icon slot="icon-only" [icon]="passwordVisible() ? eyeOffOutline : eyeOutline" aria-hidden="true"></ion-icon>
          </ion-button>
        </ion-input>
      </div>

      @if (error()) {
        <p class="login-error" role="alert" aria-live="assertive">{{ error() }}</p>
      }
      <ion-button
        expand="block"
        shape="round"
        class="login-button"
        (click)="logIn(this.credenciales.email, this.credenciales.password)"
        [disabled]="disabled()"
        [attr.aria-busy]="disabled()"
      >
        {{ disabled() ? 'Ingresando…' : 'Entrar' }}
      </ion-button>
      <p>¿Olvidaste tu contraseña? Contactá a Administración.</p>
    </div>
  </div>
</ion-content>
