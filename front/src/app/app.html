<ion-app>
  <ion-menu contentId="main-content">
    <ion-header class="menu">
      <ion-toolbar>
        <ion-title>Menú</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <ion-list>
        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/pozo">
            <ion-label>IR A POZOS</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/sitio">
            <ion-label>IR A SITIOS</ion-label>
          </ion-item>
        </ion-menu-toggle>

        @if (mainStore.isAdmin()) {
          <ion-menu-toggle auto-hide="true">
            <ion-item routerLink="/usuario">
              <ion-label>IR A USUARIOS</ion-label>
            </ion-item>
          </ion-menu-toggle>
          <ion-menu-toggle auto-hide="true">
            <ion-item routerLink="/litologias-admin">
              <ion-label>Administrar litologías</ion-label>
            </ion-item>
          </ion-menu-toggle>
        }

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/">
            <ion-label>VOLVER A HOME</ion-label>
          </ion-item></ion-menu-toggle
        >

        <ion-menu-toggle auto-hide="true">
          <ion-button fill="clear" expand="block"> Cerrar menú </ion-button>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <div class="ion-page" id="main-content">
    <ion-header>
      <ion-toolbar class="app-header">
        <ion-buttons slot="start">
          <ion-back-button  icon="arrow-back-outline"> </ion-back-button>
          <ion-menu-button aria-label="Abrir menú"></ion-menu-button>
        </ion-buttons>

        <div class="header-logo">
          <img src="/assets/branding/logo.png" alt="Raúl Silva Perforaciones" />
        </div>
        <ion-buttons slot="end" class="account-actions">
          @if(!mainStore.user()){

          <ion-button routerLink="/login" fill="clear" class="login-btn">Ingresar</ion-button>

          }@else {

          <ion-button routerLink="/usuario-detail" fill="clear" class="login-btn" [attr.aria-label]="'Mi cuenta: ' + mainStore.user()?.nombre"
            ><span class="account-name">{{ nombreCompacto() }}</span>
          </ion-button>

          }
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <div class="app-router">
      <ion-router-outlet></ion-router-outlet>
    </div>
  </div>
</ion-app>
